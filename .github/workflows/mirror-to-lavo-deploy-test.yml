name: Mirror to lavo-deploy-test

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lavo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push vers lavo-deploy-test
        run: |
          git remote add deploy https://x-access-token:${{ secrets.LAVO_MIRROR_TOKEN }}@github.com/LAVE-AUTO/lavo-deploy-test.git
          git push deploy main --force
