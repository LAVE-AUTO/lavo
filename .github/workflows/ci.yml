name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, main]

jobs:
  ci:
    name: Lint, Type-check, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Cache node_modules keyed on the lockfile so installs are skipped on cache hit.
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # No type-check script in package.json; tsc --noEmit is already configured in tsconfig.json.
      - name: Type-check
        run: npx tsc --noEmit

      # --no-coverage keeps test runs fast in CI; use npm run test:coverage for coverage reports separately.
      - name: Unit tests
        run: npm test -- --no-coverage

      - name: Build
        run: npm run build
